name: Build Redsand Particles

# Builds the modified Precision.dll on a GitHub-hosted Windows machine using the repo's own Build.ps1,
# keeps the full output as a downloadable artifact, and publishes the DLL plus its build manifest to the
# build-output branch so it can be fetched with plain git.

on:
  push:
    branches: [ bow-tip-charge-color ]
    paths-ignore: [ "**.md" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages used by the asset tools and tests
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build and test (Build.ps1)
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File Build.ps1 -WorkRoot "%RUNNER_TEMP%\redsand-build"

      - name: Keep the full build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redsand-particles-${{ github.sha }}
          path: output/
          if-no-files-found: warn

      - name: Publish Precision.dll to the build-output branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Get-ChildItem -LiteralPath output -Filter '*.zip' | Where-Object { $_.Name -notlike '*Installer*' } | Select-Object -First 1
          if (-not $runtime) { throw 'Runtime archive not found in output/' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive -LiteralPath $runtime.FullName -DestinationPath $unpacked -Force
          $dll = Get-ChildItem -LiteralPath $unpacked -Recurse -Filter 'Precision.dll' | Select-Object -First 1
          if (-not $dll) { throw 'Precision.dll not found in the runtime archive' }
          $publish = Join-Path $env:RUNNER_TEMP 'publish'
          New-Item -ItemType Directory -Path $publish | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination $publish
          if (Test-Path -LiteralPath 'output/BUILD.json') { Copy-Item -LiteralPath 'output/BUILD.json' -Destination $publish }
          Set-Content -LiteralPath (Join-Path $publish 'SOURCE.txt') -Value "Built from $env:GITHUB_REPOSITORY@$env:GITHUB_SHA ($env:GITHUB_REF_NAME)"
          Set-Location $publish
          git init -b build-output | Out-Null
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Build of $env:GITHUB_SHA" | Out-Null
          git push --force "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" build-output
